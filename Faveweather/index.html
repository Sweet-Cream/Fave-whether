<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FaveWeather — 空シミュレーター</title>
<style>
:root{
  --glass:rgba(16,22,34,.62);
  --glass2:rgba(16,22,34,.82);
  --line:rgba(255,255,255,.14);
  --text:#f3f6fb;
  --sub:rgba(243,246,251,.66);
  --accent:#9fd8ff;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1018;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;overflow:hidden;
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.secT{font-size:12px;font-weight:700;color:var(--accent);margin-top:4px;letter-spacing:.02em}
details summary{cursor:pointer;list-style:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);border-radius:var(--r)}
#hint{pointer-events:none;align-self:center;padding:6px 12px;font-size:12px;color:var(--text);max-width:min(640px,100%);text-align:center;transition:opacity .3s}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 10px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#bottom > *{width:100%;max-width:720px}
#bottom > #hint{width:auto}
#tools{pointer-events:auto;display:flex;align-items:flex-start;justify-content:flex-start;gap:2px;padding:8px 10px 6px;overflow-x:auto;scrollbar-width:none;border-radius:22px}
#bottom > #tools{max-width:900px;width:auto}
#tools > :first-child{margin-left:auto}
#tools > :last-child{margin-right:auto}
#tools::-webkit-scrollbar{display:none}
.grp{display:flex;gap:2px;flex:0 0 auto}
.sep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:4px 6px 18px}
.rb{appearance:none;background:none;border:none;color:var(--text);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px;padding:0 2px}
.rb i{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:background .15s,border-color .15s}
.rb:hover i{background:rgba(255,255,255,.13)}
.rb:active i{transform:scale(.94)}
.rb.on i{background:rgba(159,216,255,.26);border-color:var(--accent);box-shadow:0 0 0 2px rgba(159,216,255,.25)}
.rb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb span{font-size:10.5px;font-weight:600;white-space:nowrap;color:var(--sub)}
.rb.on span{color:var(--text)}
.btn{pointer-events:auto;appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);
  border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1.1}
.btn:active{transform:scale(.97)}
.btn.on{background:rgba(159,216,255,.22);border-color:var(--accent)}
.btn:disabled{opacity:.4}
#brushbar{pointer-events:auto;padding:10px 12px;display:none;flex-direction:column;gap:8px;max-height:42vh;overflow:auto}
#brushbar.show{display:flex}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;
  padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.chip.on{background:rgba(159,216,255,.22);border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
.row label{flex:0 0 auto;min-width:64px}
.row output{flex:0 0 auto;min-width:48px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:24px;min-width:60px}
select{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px}
select option{color:#000}
#sheet{pointer-events:auto;max-height:52vh;overflow:auto;padding:14px;display:none;background:var(--glass2)}
#sheet.show{display:block}
#sheet h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;justify-content:space-between}
#sheet h3 .btn{padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.preset{border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:rgba(255,255,255,.04);color:var(--text);
  cursor:pointer;font-family:inherit;text-align:left}
.preset i{display:block;height:44px}
.preset b{display:block;padding:6px 8px;font-size:12px;font-weight:600}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:11.5px;color:var(--sub);line-height:1.6}
.big{width:100%;padding:12px;font-size:14px;background:rgba(159,216,255,.22);border-color:var(--accent)}
#mini{position:fixed;left:10px;z-index:5;width:118px;height:118px;border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:none}
#mini canvas{width:100%;height:100%;display:block}
#mini .lbl{position:absolute;left:6px;top:4px;font-size:9.5px;color:var(--sub);pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:#0b1018;flex-direction:column;gap:10px;font-size:14px}
#loading{transition:opacity .7s ease}
#loading.out{opacity:0;pointer-events:none}
#loading .logo{font-size:34px;font-weight:800;letter-spacing:.02em;background:linear-gradient(180deg,#fff,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#loading .tag{font-size:13px;color:var(--sub);margin-bottom:8px}
#loading .bar{width:180px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:var(--accent);animation:ld 1.2s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;padding:9px 14px;font-size:13px;display:none;max-width:90vw;text-align:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.toggles{display:flex;flex-wrap:wrap;gap:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
/* ---- phones: every tool visible at once (two rows), and only one panel on screen at a time ---- */
@media (max-width:700px){
  #bottom{gap:6px;padding:0 6px calc(6px + env(safe-area-inset-bottom))}
  #bottom > #tools{width:100%;max-width:100%}
  #tools{flex-wrap:wrap;justify-content:center;overflow:visible;gap:2px 0;padding:6px 4px 4px;border-radius:18px}
  #tools > :first-child, #tools > :last-child{margin:0}
  .sep{display:none}
  .grp{gap:0}
  .rb{min-width:46px;gap:2px;padding:0}
  .rb i{width:38px;height:38px}
  .rb svg{width:18px;height:18px}
  .rb span{font-size:9.5px}
  #sheet{max-height:46vh;padding:12px}
  #brushbar{max-height:36vh;padding:8px 10px;gap:6px}
  #sheet.show ~ #brushbar{display:none}
  #bottom:has(#sheet.show) #hint, #bottom:has(#brushbar.show) #hint{display:none}
  #hint{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px}
  #brushbar:not(.more) #objRows{display:none !important}
  #objMore{display:inline-flex !important}
}
#objMore{display:none}
/* ---- phone dock: 5 buttons + undo, everything else lives inside them ---- */
#mdock{display:none}
#mSwitch{display:none}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;margin-top:4px}
.mgrid .rb{min-width:0}
@media (max-width:700px){
  #bottom > #tools{display:none}
  #mdock{pointer-events:auto;display:flex;align-items:flex-start;justify-content:space-around;padding:7px 4px 5px;border-radius:20px;width:100%}
  #mdock .rb{min-width:54px}
  #mdock .rb i{width:42px;height:42px}
  #mdock .rb svg{width:20px;height:20px}
  #mdock .rb span{font-size:10px}
  #mdock .mundo{min-width:46px;opacity:.9}
  #mdock .mundo i{width:36px;height:36px;margin-top:3px}
  body.m-edit #mSwitch{display:flex}
  .skytabs{display:flex;gap:6px;margin:-2px 0 10px;overflow-x:auto}
  .skytabs .chip{flex:1 0 auto}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<div id="bottom">
  <div id="hint" class="glass"></div>
  <div id="sheet" class="glass"></div>
  <div id="brushbar" class="glass">
    <div class="chips" id="mSwitch"></div>
    <div class="chips" id="modeChips"></div>
    <div class="chips" id="cloudChips"></div>
    <div class="row" id="sizeRow"><label data-i="size">大きさ</label><input type="range" id="bSize" min="200" max="8000" step="50" value="1000"><output id="bSizeO"></output></div>
    <div class="row" id="colorRow"><label data-i="cloudColor">雲の色</label><div class="chips" id="colorChips" style="flex:1"></div></div>
    <div id="objActs" class="seg" style="display:none">
      <button class="chip" data-oa="reroll" data-i="oa_reroll">形を変える</button>
      <button class="chip" data-oa="dup" data-i="oa_dup">複製</button>
      <button class="chip" data-oa="del" data-i="oa_del">削除</button>
      <button class="chip" id="objMore" data-i="o_more">詳しく</button>
    </div>
    <div id="objRows" style="display:none;flex-direction:column;gap:6px">
      <div class="row"><label data-i="o_puff">もこもこ</label><input type="range" id="oPuff" min="0" max="1" step="0.01"><output id="oPuffO"></output></div>
      <div class="row"><label data-i="o_soft">やわらかさ</label><input type="range" id="oSoft" min="0" max="1" step="0.01"><output id="oSoftO"></output></div>
      <div class="row"><label data-i="o_flat">平たさ</label><input type="range" id="oFlat" min="0" max="1" step="0.01"><output id="oFlatO"></output></div>
      <div class="row"><label data-i="o_rot">回転</label><input type="range" id="oRot" min="0" max="360" step="1"><output id="oRotO"></output></div>
      <div class="row"><label data-i="o_depth">奥行き</label><input type="range" id="oDepth" min="0.15" max="2" step="0.01"><output id="oDepthO"></output></div>
    </div>
    <div class="row" id="denRow"><label data-i="density">濃さ</label><input type="range" id="bDen" min="0.1" max="1" step="0.01" value="0.75"><output id="bDenO"></output></div>
    <div class="row" id="cloneRow" style="display:none;gap:8px">
      <button class="chip" id="recopy" data-i="recopy">コピーし直す</button>
      <button class="chip" id="scatter" data-i="scatter">まわりに複製 ×8</button>
      <span style="flex:1"></span>
      <span id="cloneState" style="font-size:11px"></span>
    </div>
  </div>
  <div id="tools" class="glass">
    <div class="grp">
      <button class="rb" data-tool="look"><i><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></i><span data-i="tool_look">見る</span></button>
      <button class="rb" id="viewBtn" data-sheet="view"><i><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16.5L12 21l8-4.5"/></svg></i><span data-i="tab_view">視点</span></button>
      <button class="rb" data-sheet="assets"><i><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 13.5v7M13.5 17h7"/></svg></i><span data-i="tab_assets">アセット</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="rb" data-tool="place"><i><svg viewBox="0 0 24 24"><path d="M8.5 16a3 3 0 0 1-.45-5.97A4.5 4.5 0 0 1 16.5 9.5a3.25 3.25 0 0 1 .25 6.5H8.5z"/><path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/></svg></i><span data-i="pm_place">置く</span></button>
      <button class="rb" data-tool="paint"><i><svg viewBox="0 0 24 24"><path d="M19 3l-8.5 8.5"/><path d="M14.5 5.5l4 4"/><path d="M10.5 11.5c-2.5 0-4 1.6-4 3.8 0 1.7-1 2.7-3 3.2 1.4 1.5 3.4 2 5.3 2 3 0 5.2-2.2 5.2-5.1l-3.5-3.9z"/></svg></i><span data-i="tool_paint">描く</span></button>
      <button class="rb" data-tool="move"><i><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></i><span data-i="tool_move">動かす</span></button>
      <button class="rb" data-tool="erase"><i><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1 .5 9H7z"/><path d="M10 14h4"/></svg></i><span data-i="tool_erase">消す</span></button>
      <button class="rb" data-tool="clone"><i><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></i><span data-i="tool_clone">複製</span></button>
      <button class="rb artool" data-tool="maskAdd" style="display:none"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg></i><span data-i="tool_maskAdd">空に追加</span></button>
      <button class="rb artool" data-tool="maskSub" style="display:none"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg></i><span data-i="tool_maskSub">空から除外</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="rb" data-sheet="weather"><i><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.2"/><path d="M8 3v1.4M2 9h1.4M3.8 4.8l1 1M12.2 4.8l-1 1"/><path d="M9 20a3.5 3.5 0 0 1-.4-6.98A5 5 0 0 1 18 12.5a3.8 3.8 0 0 1 .4 7.5H9z"/></svg></i><span data-i="tab_weather">天候</span></button>
      <button class="rb" data-sheet="sky"><i><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></i><span data-i="tab_sky">調節</span></button>
      <button class="rb" data-sheet="light"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></i><span data-i="tab_light">光</span></button>
      <button class="rb" data-sheet="look"><i><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 3-3 6 5"/><path d="M3 20h18"/><circle cx="17" cy="7" r="2"/></svg></i><span data-i="tab_look">地面</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="rb" id="undoBtn"><i><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2"/></svg></i><span data-i="undo">元に戻す</span></button>
      <button class="rb" data-sheet="export"><i><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg></i><span data-i="tab_export">書き出し</span></button>
      <button class="rb" data-sheet="settings"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></i><span data-i="tab_settings">設定</span></button>
    </div>
  </div>
  <div id="mdock" class="glass"></div>
</div>

<div id="toast" class="glass"></div>
<div id="board" style="position:fixed;inset:0;z-index:30;display:none;background:#fff">
  <canvas id="boardC" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair"></canvas>
  <div id="boardHint" style="position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:13px;color:#445;background:rgba(240,244,250,.92);padding:6px 12px;border-radius:10px;pointer-events:none" data-i="wb_hint"></div>
  <div class="glass" style="position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;padding:8px;max-width:96vw;justify-content:center;background:rgba(16,22,34,.88)">
    <button class="chip on" id="wbPen" data-i="wb_pen">ペン</button>
    <button class="chip" id="wbEraser" data-i="wb_eraser">消しゴム</button>
    <button class="chip" id="wbClear" data-i="wb_clear">全部消す</button>
    <span style="width:1px;background:var(--line);margin:0 4px"></span>
    <span class="chips" id="wbTypes"></span>
    <span style="width:1px;background:var(--line);margin:0 4px"></span>
    <span class="chips" id="wbDist"></span>
    <span style="width:1px;background:var(--line);margin:0 4px"></span>
    <button class="chip" id="wbConvert" style="background:rgba(159,216,255,.3);border-color:var(--accent)" data-i="wb_convert">空に変換</button>
    <button class="chip" id="wbClose" data-i="close">閉じる</button>
  </div>
</div>
<div id="shapeEd" style="position:fixed;inset:0;z-index:31;display:none;background:#0d1420">
  <canvas id="shapeC" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair"></canvas>
  <div style="position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;max-width:96vw">
    <div id="shapeHint" style="font-size:13px;color:#dfe8f5;background:rgba(16,22,34,.88);padding:6px 12px;border-radius:10px;pointer-events:none;text-align:center" data-i="sh_hint"></div>
    <div class="glass" style="display:flex;flex-wrap:wrap;gap:6px;padding:8px;justify-content:center;background:rgba(16,22,34,.92)">
      <button class="chip" id="shImg" data-i="sh_img">画像を読み込む</button>
      <span style="width:1px;background:var(--line);margin:0 4px"></span>
      <button class="chip on" id="shPen" data-i="sh_pen">筆</button>
      <button class="chip" id="shEr" data-i="sh_er">消しゴム</button>
      <button class="chip" id="shClear" data-i="wb_clear">全部消す</button>
      <span style="width:1px;background:var(--line);margin:0 4px"></span>
      <input id="shName" maxlength="20" style="width:120px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);padding:6px 8px;font:inherit;font-size:13px">
      <button class="chip" id="shSave" style="background:rgba(159,216,255,.3);border-color:var(--accent)" data-i="sh_save">保存して使う</button>
      <button class="chip" id="shClose" data-i="close">閉じる</button>
    </div>
  </div>
</div>
<input type="file" id="shapeFile" accept="image/*" style="display:none">

const extCBH = gl && gl.getExtension("EXT_color_buffer_half_float");
if(gl) gl.getExtension("OES_texture_float_linear");

const VS = `#version 300 es
in vec2 aP; void main(){ gl_Position = vec4(aP,0.,1.); }`;

const ATMOS = `
const float PI = 3.14159265359;
const float RP = 6360e3;
const float RA = 6460e3;
const float SUN_I = 20.0;
const vec3 BR = vec3(5.802e-6, 13.558e-6, 33.1e-6);
const vec3 BOZ = vec3(0.650e-6, 1.881e-6, 0.085e-6);
uniform float uTurb;
uniform float uDust;
uniform vec3 uSunDir;
vec2 raySphere(vec3 ro, vec3 rd, float r){
  float b = dot(ro, rd); float c = dot(ro, ro) - r*r; float h = b*b - c;
  if(h < 0.) return vec2(-1.); h = sqrt(h); return vec2(-b - h, -b + h);
}
vec3 mieScat(){ return vec3(3.996e-6 * uTurb); }
vec3 mieExt(){ return mieScat() * (1.11 + uDust * vec3(0.35, 0.8, 1.9)); }
vec3 extinction(float h){
  float dr = exp(-h / 8000.);
  float dm = exp(-h / 1200.);
  float dz = max(0., 1. - abs(h - 25000.) / 15000.);
  return BR*dr + mieExt()*dm + BOZ*dz;
}
vec3 transmittance(vec3 p, vec3 d){
  vec2 tp = raySphere(p, d, RP);
  if(tp.x > 0.) return vec3(0.);
  float tl = raySphere(p, d, RA).y;
  float ds = tl / 10.;
  vec3 od = vec3(0.);
  for(int i = 0; i < 10; i++){
    vec3 q = p + d * (ds * (float(i) + 0.5));
    od += extinction(length(q) - RP) * ds;
  }
  return exp(-od);
}
float phaseR(float mu){ return 3. / (16. * PI) * (1. + mu*mu); }
float hg(float mu, float g){ float g2 = g*g; return (1. - g2) / (4. * PI * pow(max(1. + g2 - 2.*g*mu, 1e-4), 1.5)); }
`;

const FS_LUT = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uLutRes;
${ATMOS}
void main(){
  vec2 uv = gl_FragCoord.xy / uLutRes;
  float lon = (uv.x - 0.5) * 2. * PI;
  float lat = (uv.y - 0.5) * PI;
  vec3 d = vec3(sin(lon)*cos(lat), sin(lat), -cos(lon)*cos(lat));
  vec3 ro = vec3(0., RP + 2., 0.);
  float tmax = raySphere(ro, d, RA).y;
  vec2 tg = raySphere(ro, d, RP);
  bool ground = tg.x > 0.;
  if(ground) tmax = tg.x;
  float mu = dot(d, uSunDir);
  float pr = phaseR(mu), pm = hg(mu, 0.76);
  vec3 L = vec3(0.); vec3 T = vec3(1.);
  const int N = 28;
  float prev = 0.;
  for(int i = 0; i < N; i++){
    float f = (float(i) + 1.) / float(N);
    float tc = tmax * f * f;
    float ds = tc - prev;
    float tm = prev + ds * 0.5;
    prev = tc;
    vec3 q = ro + d * tm;
    float h = length(q) - RP;
    float dr = exp(-h / 8000.), dm = exp(-h / 1200.);
    vec3 ext = extinction(h);
    vec3 sT = transmittance(q, uSunDir);
    vec3 scat = (BR*dr*pr + mieScat()*dm*pm) * sT;
    // crude multiple scattering term keeps twilight and horizon from going black
    vec3 ms = (BR*dr + mieScat()*dm) * 0.03 * clamp(uSunDir.y*4. + 0.4, 0., 1.) * vec3(0.8,0.9,1.0);
    vec3 S = (scat + ms) * SUN_I;
    vec3 tr = exp(-ext * ds);
    L += T * (S - S*tr) / max(ext, vec3(1e-12));
    T *= tr;
  }
  if(ground){
    vec3 gp = ro + d * tmax;
    vec3 n = normalize(gp);
    vec3 alb = vec3(0.03, 0.036, 0.026);
    vec3 sT = transmittance(gp + n*2., uSunDir);
    L += T * alb / PI * SUN_I * (sT * max(dot(n, uSunDir), 0.) + 0.08 * smoothstep(-0.12, 0.15, uSunDir.y) + 0.00004);
  }
  o = vec4(L, 1.);
}`;

const FS_MAIN = `#version 300 es
precision highp float;
precision highp sampler3D;
out vec4 o;
uniform vec2 uRes;
uniform vec3 uCamF, uCamR, uCamU;
uniform float uTanHalf;
uniform int uMode;          // 0 = preview, 1 = equirect HDR
uniform sampler2D uSky;
uniform sampler2D uMap;
uniform sampler2D uTint;
uniform sampler2D uMap2;
uniform float uSlabLo, uSlabHi;
uniform sampler3D uShape;
uniform sampler3D uDetail;
uniform vec2 uWind;
uniform float uCovScale, uCirScale;
uniform float uCov, uTime, uBase, uMaxTop, uDens, uExposure, uFog, uRain, uSnow, uFlash, uRainbow, uStars, uCirrusH;
uniform vec3 uFlashPos;
uniform vec3 uLightDir, uMoonDir;
uniform float uLightI, uRays, uHalo, uIrid, uMilky, uAurora, uMoonOn, uMoonPhase, uMoonI;
uniform int uSteps;
uniform int uHQ;
uniform float uStarDens, uStarSat, uLightPol, uNight, uRayHaze, uRayWarm, uAurHue, uAurSpeed;
uniform vec4 uMet[2];
uniform vec3 uMetE[2];
uniform float uCamH;
uniform vec2 uCirOff;
uniform sampler2D uStarTex;
uniform mat3 uGalM;
uniform float uGalOn;
uniform vec2 uJit, uNoiseOff;
uniform int uGround, uStyle;
uniform float uPix;
uniform int uCVD;
uniform sampler2D uBg, uMask;
uniform int uAR;
uniform vec4 uBgXf;
uniform float uAROpacity, uMaskShow;
${ATMOS}
const float MAPSIZE = 60000.;

vec3 skyL(vec3 d){
  float lon = atan(d.x, -d.z);
  float lat = asin(clamp(d.y, -1., 1.));
  vec3 c = texture(uSky, vec2(lon / (2.*PI) + 0.5, lat / PI + 0.5)).rgb;
  return c + vec3(0.00016, 0.00022, 0.00034) * (0.6 + 0.4 * smoothstep(0.25, -0.02, d.y)) * smoothstep(-0.2, 0.05, d.y);
}
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 hash33(vec3 p3){ p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }

float thickOf(float g){ return 250. + 8750. * g * g; }

float cloudD(vec3 p, bool det, out float hf){
  hf = 0.;
  vec2 w = p.xz + uWind;
  vec4 m = textureLod(uMap, w / MAPSIZE + 0.5, 0.);
  float cov = min(m.r * uCovScale, 1.);
  if(cov < 0.015) return 0.;
  float r2 = dot(p.xz, p.xz);
  float y = p.y + r2 / (2. * RP);
  float th = thickOf(m.g);
  float b2 = textureLod(uMap2, w / MAPSIZE + 0.5, 0.).r;
  float base = b2 > 0.002 ? b2 * 8000. : uBase;
  float h = (y - base) / th;
  if(h < 0. || h > 1.) return 0.;
  hf = h;
  float a = m.a;
  float bottom = smoothstep(0., mix(0.14, 0.05, a), h);
  float top = 1. - smoothstep(min(mix(0.15, 0.7, a) + m.g * 0.5, 0.8), 1., h);
  float anvil = smoothstep(0.8, 0.9, h) * (1. - smoothstep(0.95, 1., h)) * clamp((m.g - 0.75) * 4., 0., 1.);
  float prof = bottom * max(top, anvil * 1.25);
  vec3 q = vec3(w.x, y * mix(1.25, 2.2, a), w.y) / 9000. + vec3(0., uTime * 0.0015, 0.);
  float s = texture(uShape, q).r;
  // towers taper with height so they don't stand like boxes
  float covT = cov - h * mix(0.12, 0.42, smoothstep(0.3, 1., m.g)) * (1. - a);
  float c = clamp(sqrt(max(covT, 0.)) * prof * 1.08, 0., 1.);
  float d = clamp((s - (1. - c)) / max(c, 0.05), 0., 1.) * c;
  if(det && d > 0.){
    vec3 pp = vec3(w.x, y, w.y);
    vec3 warp = texture(uDetail, pp / 4200. + vec3(0.31, uTime * 0.002, 0.)).gba - 0.5;
    float dn = texture(uDetail, pp / 1150. + warp * 0.32 + vec3(uTime*0.004, 0., 0.)).r;
    if(r2 < 1.6e8) dn = mix(dn, texture(uDetail, pp / 330. + warp * 0.6).r, 0.3 * (1. - smoothstep(4e7, 1.6e8, r2)));
    float puffA = textureLod(uTint, w / MAPSIZE + 0.5, 0.).a;
    float dm = mix(dn, 1. - dn, clamp(h * 3., 0., 1.)) * 0.48 * (1. - a * 0.5) * (uStyle == 1 ? 0.45 : 1.) * mix(0.2, 1.8, puffA);
    d = clamp((d - dm) / (1. - dm), 0., 1.);
  }
  d *= 1. - smoothstep(36000., 54000., sqrt(r2));
  if(uStyle == 1) d = smoothstep(0.015, 0.05, d) * 0.55;
  return d;
}

vec4 clouds(vec3 ro, vec3 rd, vec3 sunL, vec3 amb, vec2 fc, int steps){
  if(uMaxTop < 1.) return vec4(0., 0., 0., 1.);
  float t0, t1;
  if(abs(rd.y) < 1e-4){
    if(ro.y < uSlabLo || ro.y > uSlabHi) return vec4(0., 0., 0., 1.);
    t0 = 0.; t1 = 58000.;
  } else {
    float ta = (uSlabLo - ro.y) / rd.y, tb = (uSlabHi - ro.y) / rd.y;
    t0 = max(min(ta, tb), 0.); t1 = min(max(ta, tb), 58000.);
  }
  if(rd.y < 0.) t1 = min(t1, ro.y / -rd.y);
  if(t0 >= t1) return vec4(0., 0., 0., 1.);
  float mu = dot(rd, uLightDir);
  float baseStep = max((t1 - t0) / float(steps), 35.);
  float jit = ign(fc + uNoiseOff);
  float t = t0 + baseStep * jit;
  float T = 1.;
  vec3 L = vec3(0.);
  float tw = 0., ww = 0.;
  int maxI = steps * 3;
  bool wasEmpty = false;
  for(int i = 0; i < 400; i++){
    if(i >= maxI || t > t1 || T < 0.004) break;
    vec3 p = ro + rd * t;
    float st = baseStep * (1. + t / 25000.);
    float hf;
    float dc = cloudD(p, false, hf);
    if(dc <= 0.){ t += st * 1.6; wasEmpty = true; continue; }
    if(wasEmpty){ wasEmpty = false; t -= st * 0.8; p = ro + rd * t; }
    float d = cloudD(p, true, hf);
    if(d > 0.002){
      float sig = d * uDens;
      // light march toward the sun: fine detail close by, long reach for big towers
      int nl = uHQ == 1 ? 9 : 6;
      float od = 0.; float ls = uHQ == 1 ? 40. : 55.; vec3 lp = p;
      for(int j = 0; j < 9; j++){
        if(j >= nl) break;
        lp += uLightDir * ls;
        float hh;
        od += cloudD(lp, uHQ == 1 && j < 2, hh) * ls;
        ls *= uHQ == 1 ? 1.62 : 1.75;
      }
      od *= uDens;
      // multiple scattering (octaves with a softer phase each time)
      float lum = 0.; float ea = 1., eb = 1., ec = 1.;
      for(int k = 0; k < 4; k++){
        float ph = mix(hg(mu, 0.82 * ec), hg(mu, -0.2 * ec), 0.25) + hg(mu, 0.97) * 0.06 * ec;
        lum += eb * ph * exp(-od * ea);
        ea *= 0.42; eb *= 0.5; ec *= 0.5;
      }
      // view-dependent powder: dark crevices except when looking toward the sun
      float pw = 1. - exp(-sig * 420.);
      float powder = mix(mix(1., pw, 0.75), 1., smoothstep(0.3, 0.95, mu));
      // how much open sky each point sees (occlusion from the cloud above it)
      float odUp = 0.;
      if(uHQ == 1){
        float hh;
        odUp = (cloudD(p + vec3(0., 120., 0.), false, hh) * 120. + cloudD(p + vec3(0., 380., 0.), false, hh) * 260. + cloudD(p + vec3(0., 900., 0.), false, hh) * 520.) * uDens;
      } else {
        odUp = (1. - hf) * 4.;
      }
      float skyVis = exp(-odUp * 0.35);
      vec3 ground = vec3(0.09, 0.09, 0.08) * (sunL * max(uLightDir.y, 0.) / PI + amb * 0.5);
      vec3 ambC = amb * mix(0.25, 1.0, skyVis) * mix(0.55, 1.0, hf) + ground * (1. - hf) * 0.9;
      vec3 flash = vec3(0.75, 0.82, 1.0) * uFlash * 45. * exp(-length(p - uFlashPos) / 2600.);
      vec3 tint = pow(textureLod(uTint, (p.xz + uWind) / MAPSIZE + 0.5, 0.).rgb, vec3(1.8));
      vec3 S = (sunL * lum * powder * 2.4 + ambC + flash) * sig;
      if(uStyle == 1){
        float tl = exp(-od * 0.3);
        float band = smoothstep(0.40, 0.47, tl) * 0.65 + smoothstep(0.1, 0.15, tl) * 0.35;
        vec3 shadowC = amb * vec3(0.78, 0.84, 1.08) * 1.15 + sunL * 0.012;
        vec3 litC = sunL * 0.30 + amb * 0.55;
        float rim = smoothstep(0.6, 1., dot(rd, uLightDir)) * (1. - band) * 0.5;
        S = (mix(shadowC, litC, band) + sunL * 0.2 * rim + flash) * sig;
      }
      S *= tint;
      float tr = exp(-sig * st);
      L += T * (S - S * tr) / max(sig, 1e-7);
      float wgt = T * (1. - tr);
      tw += t * wgt; ww += wgt;
      T *= tr;
    }
    t += min(st, 60. + t * 0.004);
  }
  T = max(0., (T - 0.004) / 0.996);
  float dist = ww > 0. ? tw / ww : t1;
  float ap = 1. - exp(-dist * (0.000012 * uTurb + uFog * 0.00025));
  L = mix(L, skyL(rd) * mix(1., 0.45, uCov) * (1. - T), clamp(ap, 0., 1.));
  return vec4(L, T);
}

vec4 cirrus(vec3 rd, vec3 sunL, vec3 amb){
  if(rd.y <= 0.01) return vec4(0.);
  float t = (uCirrusH - uCamH) / rd.y;
  if(t <= 0. || t > 120000.) return vec4(0.);
  vec2 w = rd.xz * t + uCirOff;
  float cov = min(textureLod(uMap, w / MAPSIZE + 0.5, 0.).b * uCirScale, 1.);
  if(cov < 0.01) return vec4(0.);
  float n1 = texture(uShape, vec3(w.x / 26000., w.y / 6500., 0.37)).r;
  float n2 = texture(uDetail, vec3(w.x / 5200., w.y / 1800., 0.61)).r;
  float n3 = texture(uDetail, vec3(w.x / 1400., w.y / 900., 0.2)).r;
  float n = n1 * 0.62 + n2 * 0.3 + n3 * 0.12;
  float d = clamp((n - (1. - cov)) / max(cov, 0.05), 0., 1.) * cov;
  d = smoothstep(0., 0.9, d);
  float a = d * 0.75 * exp(-t / 110000.);
  float mu = dot(rd, uLightDir);
  vec3 c = (sunL * mix(hg(mu, 0.75), hg(mu, -0.2), 0.35) * 2.4 + amb * 0.9) * a;
  c = mix(c, skyL(rd) * a, 1. - exp(-t * 0.000006 * uTurb));
  return vec4(c, a);
}

vec3 stars(vec3 d){
  vec3 q = d * 260.;
  vec3 c = floor(q);
  float h = hash13(c);
  if(h < 1. - 0.025 * uStarDens) return vec3(0.);
  vec3 f = fract(q) - 0.5 - (hash33(c) - 0.5) * 0.6;
  float s = smoothstep(0.16, 0.0, length(f));
  float mag = pow(clamp((h - (1. - 0.025 * uStarDens)) / (0.025 * uStarDens), 0., 1.), 4.);
  vec3 col = mix(vec3(1.), mix(vec3(1., 0.72, 0.5), vec3(0.62, 0.76, 1.), hash13(c + 7.)), uStarSat);
  return col * s * mag * 0.06;
}

vec3 hue(float x){ return clamp(vec3(abs(x*6.-3.)-1., 2.-abs(x*6.-2.), 2.-abs(x*6.-4.)), 0., 1.); }
vec3 rainbowC(vec3 rd){
  float ang = degrees(acos(clamp(dot(rd, -uLightDir), -1., 1.)));
  vec3 c = vec3(0.);
  float x = (ang - 40.4) / 2.1;
  if(x > 0. && x < 1.) c += hue((1. - x) * 0.78) * sin(x * PI);
  float x2 = (ang - 50.2) / 3.3;
  if(x2 > 0. && x2 < 1.) c += hue(x2 * 0.78) * sin(x2 * PI) * 0.35;
  c += vec3(0.06) * smoothstep(40.5, 36., ang) * step(ang, 40.5);
  return c * smoothstep(0.0, 0.08, rd.y);
}

float rainLayer(vec2 uv, float s, float sp){
  uv *= vec2(s, s * 0.09);
  uv.x += uv.y * 0.9 * 0.09;
  uv.y += uTime * sp;
  vec2 id = floor(uv); vec2 f = fract(uv);
  float h = hash12(id);
  if(h > 0.35) return 0.;
  float x = abs(f.x - 0.15 - 0.7 * hash12(id + 3.1));
  return smoothstep(0.045, 0., x) * smoothstep(0., 0.35, f.y) * smoothstep(1., 0.55, f.y) * (0.5 + h);
}
float snowLayer(vec2 uv, float s, float sp){
  uv *= s;
  uv.y += uTime * sp;
  uv.x += sin(uTime * 0.7 + uv.y * 0.35) * 0.35;
  vec2 id = floor(uv); vec2 f = fract(uv) - 0.5;
  float h = hash12(id);
  if(h > 0.55) return 0.;
  vec2 off = (vec2(hash12(id + 1.7), hash12(id + 9.2)) - 0.5) * 0.6;
  return smoothstep(0.1 + h * 0.08, 0.0, length(f - off));
}


float azim(vec3 v){ return atan(v.x, -v.z); }

// ---- ice-crystal halos: 22° halo, 46° halo, sun dogs, circumzenithal arc, light pillar
vec3 halos(vec3 rd, vec3 L){
  float ang = degrees(acos(clamp(dot(rd, L), -1., 1.)));
  float el = degrees(asin(clamp(L.y, -1., 1.)));
  float e = degrees(asin(clamp(rd.y, -1., 1.)));
  float da = azim(rd) - azim(L);
  float dAz = degrees(abs(atan(sin(da), cos(da))));
  vec3 c = vec3(0.);
  float x = ang - 21.8;
  c += mix(vec3(1., 0.4, 0.18), vec3(0.95, 0.97, 1.), smoothstep(0., 2.6, x)) * smoothstep(-0.5, 0.25, x) * exp(-max(x, 0.) / 2.4) * 1.5;
  float x2 = ang - 45.8;
  c += mix(vec3(1., 0.5, 0.3), vec3(0.9, 0.95, 1.), smoothstep(0., 3., x2)) * smoothstep(-0.6, 0.3, x2) * exp(-max(x2, 0.) / 3.) * 0.16;
  float D = 22. / max(cos(radians(el)), 0.35);
  float y = ang - D;
  float de = e - el;
  float dog = exp(-de*de / 1.3) * smoothstep(-0.6, 0.2, y) * (exp(-max(y, 0.) / 1.6) * 2.2 + exp(-max(y, 0.) / 18.) * 0.12);
  c += mix(vec3(1., 0.35, 0.15), vec3(1.), smoothstep(0., 2.2, y)) * dog * smoothstep(58., 40., el);
  float zr = 44. - el;
  float yz = (90. - e) - zr;
  float xz = clamp((yz + 1.3) / 2.6, 0., 1.);
  float cza = smoothstep(1.3, 0.6, abs(yz)) * smoothstep(60., 25., dAz) * smoothstep(1., 8., el) * smoothstep(32., 22., el);
  c += hue(xz * 0.72) * cza * 1.4;
  float hd = dAz * cos(radians(e));
  float v = e - el;
  float pil = exp(-hd*hd / 1.1) * (v > 0. ? exp(-v / 7.) : exp(v / 2.5)) * smoothstep(9., 2., el) * smoothstep(-5., -1.5, el);
  c += vec3(1., 0.82, 0.62) * pil * 9.;
  return c;
}

// ---- crepuscular rays: cloud shadows cutting through the hazy air below the clouds
vec4 godrays(vec3 rd, vec3 sunL, vec2 fc){
  vec3 L = uLightDir;
  if(L.y < -0.02 || uMaxTop < 1.) return vec4(0., 0., 0., 1.);
  float tMax = rd.y > 0.002 ? min((uBase - 2.) / rd.y, 26000.) : 26000.;
  float mu = dot(rd, L);
  float ph = hg(mu, 0.7) * 0.85 + hg(mu, -0.25) * 0.15;
  const int N = 18;
  float dt = tMax / float(N);
  float j = ign(fc * 1.7 + 3. + uNoiseOff);
  float accS = 0., accF = 0.;
  float Ly = max(L.y, 0.03);
  for(int i = 0; i < N; i++){
    vec3 p = vec3(0., uCamH, 0.) + rd * (dt * (float(i) + j));
    float tl = max(uSlabLo + 150. - p.y, 0.) / Ly;
    float od = 0.;
    for(int k = 0; k < 4; k++){
      vec3 q = p + L * (tl + (float(k) + 0.5) * 420.);
      float hh; od += cloudD(q, false, hh);
    }
    float sh = exp(-od * uDens * 420.);
    float w = exp(-max(p.y, 0.) / 1300.) * dt;
    accS += sh * w; accF += w;
  }
  float beta = 3.996e-6 * uTurb * (1. + uRays * 4.) * uRayHaze;
  return vec4(sunL * ph * beta * accS * uRays * 0.35, accS / max(accF, 1e-3));
}

// ---- cloud iridescence (彩雲) and corona (光環) on thin cloud near the light
vec3 iridescence(vec3 rd, float thin, vec3 sunL){
  float ang = degrees(acos(clamp(dot(rd, uLightDir), -1., 1.)));
  float n = texture(uDetail, rd * 3.1).r;
  vec3 c = (hue(fract(ang / 6.5 + n * 0.9)) - 0.33) * smoothstep(34., 5., ang) * 0.9;
  c += hue(fract(ang / 1.75)) * exp(-ang / 3.2) * 1.5 * smoothstep(9., 0.6, ang);
  return c * thin * uIrid * length(sunL) * 0.14;
}

// ---- Milky Way
vec3 milky(vec3 rd){
  vec3 pole = normalize(vec3(0.35, 0.45, 0.82));
  vec3 gc = normalize(cross(pole, vec3(0., 1., 0.)));
  float b = dot(rd, pole);
  float band = exp(-b*b / 0.028);
  float core = exp(-b*b / 0.006);
  float n1 = texture(uDetail, rd * 1.9).r;
  float n2 = texture(uShape, rd * 0.8 + 0.3).r;
  float rift = smoothstep(0.5, 0.78, texture(uShape, rd * 2.6 + 0.1).r) * exp(-b*b / 0.0035);
  float br = band * (0.35 + 0.9 * n2) + core * n1;
  br *= 1. - rift * 0.85;
  br *= 0.45 + 1.1 * pow(max(dot(rd, gc) * 0.5 + 0.5, 0.), 3.);
  vec3 c = mix(vec3(0.75, 0.8, 1.), vec3(1., 0.9, 0.78), core) * br * 0.0026;
  c += stars(normalize(rd * 1.37 + 0.1)) * band * 0.8;
  return c;
}

// ---- Moon (phase, glow) — also the light source for clouds at night
vec3 moon(vec3 rd){
  vec3 m = uMoonDir;
  float cm = dot(rd, m);
  vec3 right = normalize(cross(m, vec3(0., 1., 0.)) + vec3(1e-5, 0., 0.));
  vec3 up = cross(right, m);
  const float r = 0.0062;
  vec2 q = vec2(dot(rd, right), dot(rd, up)) / r;
  float d2 = dot(q, q);
  vec3 c = vec3(0.);
  if(cm > 0. && d2 < 1.){
    vec3 n = vec3(q, sqrt(1. - d2));
    float ph = (1. - uMoonPhase) * PI;
    vec2 sd = normalize(vec2(dot(uSunDir, right), dot(uSunDir, up)) + vec2(1e-4, 0.));
    vec3 sl = vec3(sd * sin(ph), cos(ph));
    float lit = smoothstep(-0.03, 0.08, dot(n, sl));
    float alb = 0.62 + 0.38 * texture(uDetail, vec3(q * 0.33, 0.47)).r;
    c += vec3(1., 0.97, 0.92) * (lit * alb + 0.01) * 0.85 * smoothstep(1., 0.94, d2);
  }
  float bright = 0.08 + 0.92 * uMoonPhase * uMoonPhase;
  c += vec3(0.7, 0.8, 1.) * (hg(cm, 0.985) * 0.00006 + hg(cm, 0.8) * 0.00012) * (0.5 + uTurb * 0.4) * bright;
  return c * transmittance(vec3(0., RP + 2., 0.), m);
}

// ---- Aurora curtains (to the north, 95–265 km up)
vec3 aurora(vec3 rd, vec2 fc){
  vec3 ro = vec3(0., RP + 2., 0.);
  float jj = ign(fc + 11. + uNoiseOff);
  vec3 acc = vec3(0.);
  float w = uTime * 0.02 * uAurSpeed;
  for(int i = 0; i < 22; i++){
    float hf = (float(i) + jj) / 22.;
    float t = raySphere(ro, rd, RP + 95e3 + hf * 170e3).y;
    if(t < 0.) continue;
    vec3 p = (ro + rd * t) / 1000.;
    float n = texture(uDetail, vec3(p.x / 900., p.z / 300., 0.37 + w * 0.3)).r;
    float zc = -330. + (n - 0.5) * 420.;
    float dz = (p.z - zc) / (10. + 26. * n * n);
    float ribbon = exp(-dz * dz);
    float stri = texture(uShape, vec3(p.x / 55. + w, 0.21, p.z / 400.)).r;
    vec3 c = mix(mix(vec3(0.12, 1., 0.42), vec3(1.0, 0.22, 0.32), uAurHue), mix(vec3(0.75, 0.18, 0.72), vec3(0.5, 0.25, 1.0), uAurHue), smoothstep(0.25, 0.85, hf));
    acc += c * ribbon * (0.3 + stri * 1.3) * mix(exp(-hf * 2.6), 0.32, smoothstep(0.3, 0.9, hf));
  }
  return acc * 0.0007;
}


// ---------------- sky composite (used for the view and for reflections) ----------------
vec3 gCloudL = vec3(0.);
float gCloudA = 1.;
vec4 skyComposite(vec3 rd, vec3 sunL, vec3 amb, vec2 fc, int steps){
  vec3 ro = vec3(0., uCamH, 0.);
  vec3 col = skyL(rd);
  if(rd.y < 0.) col *= mix(1., 0.45, uCov * smoothstep(0., -0.03, rd.y));
  float cs = dot(rd, uSunDir);
  if(rd.y > -0.02){
    float disc = smoothstep(0.99996, 0.99998, cs);
    vec3 sT = transmittance(vec3(0., RP + 2., 0.), rd);
    col += SUN_I * sT * pow(max(cs, 0.), 900.) * 0.02;
    col += SUN_I * sT * disc * (uMode == 1 ? 900. : 120.);
  }
  if(uStars > 0.) col += stars(rd) * uStars * 0.6 * smoothstep(-0.02, 0.15, rd.y);
  if(uGalOn > 0. && rd.y > -0.05){
    vec3 g = uGalM * rd;
    vec2 guv = vec2(atan(g.y, g.x) / (2. * PI) + 0.5, asin(clamp(g.z, -1., 1.)) / PI + 0.5);
    vec4 st = texture(uStarTex, guv);
    vec3 ext = transmittance(vec3(0., RP + 2., 0.), normalize(vec3(rd.x, max(rd.y, 0.002), rd.z)));
    float hz = smoothstep(-0.02, 0.06, rd.y);
    col += (st.rgb * uMilky + vec3(st.a) * uStars * 0.9) * ext * hz;
  }
  if(uAurora > 0. && rd.y > -0.02) col += aurora(rd, fc) * uAurora;
  if(uLightPol > 0.) col += vec3(1.0, 0.62, 0.36) * uLightPol * uNight * 0.0016 * exp(-max(rd.y, 0.) * 6.) * smoothstep(-0.08, 0.0, rd.y);
  for(int i = 0; i < 2; i++){
    float pg = uMet[i].w;
    if(pg <= 0. || pg >= 1.) continue;
    vec3 a0 = uMet[i].xyz, b0 = uMetE[i];
    vec3 head = normalize(mix(a0, b0, pg)), tail = normalize(mix(a0, b0, max(pg - 0.35, 0.)));
    vec3 ab = head - tail;
    float tt = clamp(dot(rd - tail, ab) / max(dot(ab, ab), 1e-8), 0., 1.);
    vec3 pp = normalize(mix(tail, head, tt));
    float dd = acos(clamp(dot(rd, pp), -1., 1.));
    float fadeIn = smoothstep(0., 0.15, pg) * smoothstep(1., 0.7, pg);
    col += vec3(0.85, 0.95, 1.0) * 0.006 * exp(-pow(dd / 0.0011, 2.)) * tt * tt * fadeIn * uNight * smoothstep(0., 0.05, rd.y);
  }
  if(uMoonOn > 0.) col += moon(rd) * uMoonOn;
  vec4 ci = cirrus(rd, sunL, amb);
  col = col * (1. - ci.a) + ci.rgb;
  if(uHalo > 0.) col += halos(rd, uLightDir) * uHalo * length(sunL) * 0.016 * (0.35 + ci.a * 2.6) * smoothstep(-0.03, 0.02, rd.y);
  vec4 cl = clouds(ro, rd, sunL, amb, fc, steps);
  col = col * cl.a + cl.rgb;
  if(uIrid > 0.){
    float thin = max(cl.a * (1. - cl.a) * 4., ci.a * (1. - ci.a) * 3.);
    col = max(col + iridescence(rd, thin, sunL), col * 0.6);
  }
  if(uRays > 0. && rd.y > -0.01){
    vec4 g = godrays(rd, sunL, fc);
    float wt = 0.35 + 0.65 * smoothstep(-0.3, 0.95, dot(rd, uLightDir));
    float hz = smoothstep(-0.01, 0.02, rd.y);
    col = col * mix(1., g.a, uRays * 0.7 * wt * hz) + g.rgb * hz * mix(vec3(1.), vec3(1.25, 0.95, 0.62), uRayWarm);
  }
  if(uRainbow > 0.) col += rainbowC(rd) * uRainbow * length(sunL) * 0.0035 * (0.4 + 0.6 * cl.a);
  gCloudL = cl.rgb + cl.a * ci.rgb; gCloudA = cl.a * (1. - ci.a);
  return vec4(col, cl.a * (1. - ci.a));
}

float n2(vec2 w, float sc){ return texture(uShape, vec3(w / sc, 0.43)).r; }
float cloudShadow(vec3 p){
  if(uMaxTop < 1. || uLightDir.y < 0.02) return uLightDir.y < 0.02 ? 0.6 : 1.;
  float tl = max(uSlabLo + 250. - p.y, 0.) / max(uLightDir.y, 0.05);
  float od = 0.;
  for(int k = 0; k < 3; k++){ float hh; od += cloudD(p + uLightDir * (tl + float(k) * 450.), false, hh); }
  return exp(-od * uDens * 450.);
}

// ground types: 0 simple, 1 grass, 2 desert, 3 snow, 4 sea, 5 mirror (salt flat), 6 cloud sea, 7 mountains, 8 city, 9 none
vec3 groundShade(vec3 rd, vec3 sunL, vec3 amb, vec2 fc){
  vec3 L = uLightDir;
  float camH = uGround == 6 ? max(900., uCamH) : max(1.7, uCamH);
  float t = camH / max(-rd.y, 1e-4);
  vec3 p = vec3(0., 0., 0.) + rd * t; p.y = 0.;
  vec2 w = p.xz + vec2(0., 0.);
  vec3 hzSky = skyL(normalize(vec3(rd.x, 0.015, rd.z))) * mix(1., 0.5, uCov);
  // haze thins with altitude: integrate along the slant path when looking down from high up
  float sl = max(-rd.y, 0.02);
  float hzOd = camH < 60. ? t * (0.000045 * uTurb + uFog * 0.0012)
    : 0.000045 * uTurb * 1500. * (1. - exp(-camH / 1500.)) / sl + uFog * 0.0012 * min(t, 400. / sl);
  float haze = 1. - exp(-hzOd);
  float sh = cloudShadow(vec3(p.x, 0., p.z));
  vec3 E = sunL * max(L.y, 0.) * sh;
  vec3 c;
  if(uGround == 4 || uGround == 5){
    float tt = uTime;
    vec3 N;
    if(uGround == 4){
      float e = 0.6;
      vec2 q = w * 0.035;
      float hx = n2(w + vec2(tt*3., 0.), 70.) - n2(w + vec2(tt*3. + e*20., 0.), 70.);
      float hz = n2(w + vec2(0., tt*2.), 70.) - n2(w + vec2(0., tt*2. + e*20.), 70.);
      float hx2 = n2(w * 3.1 + vec2(tt*5., 0.), 40.) - n2(w * 3.1 + vec2(tt*5. + 9., 0.), 40.);
      N = normalize(vec3((hx + hx2 * 0.5) * 0.9, 1., hz * 0.9));
    } else {
      float r1 = n2(w, 6.) - n2(w + vec2(0.4, 0.), 6.);
      float r2 = n2(w, 6.) - n2(w + vec2(0., 0.4), 6.);
      N = normalize(vec3(r1 * 0.04, 1., r2 * 0.04));
    }
    vec3 rr = reflect(rd, N); rr.y = max(rr.y, 0.004); rr = normalize(rr);
    float fres = 0.02 + 0.98 * pow(1. - max(dot(-rd, N), 0.), 5.);
    vec3 refl = skyComposite(rr, sunL, amb, fc, max(uSteps / 2, 24)).rgb;
    if(uGround == 4){
      vec3 body = vec3(0.003, 0.014, 0.02) * (amb * 2. + E * 0.05);
      c = mix(body, refl, fres);
    } else {
      vec3 salt = vec3(0.55, 0.56, 0.58) * (E / PI + amb);
      c = mix(salt * 0.35, refl, 0.82);
    }
  } else if(uGround == 6){
    float a1 = n2(w, 9000.), a2 = n2(w, 2600.), a3 = n2(w, 700.);
    float hgt = a1 * 0.55 + a2 * 0.3 + a3 * 0.15;
    float gx = n2(w + vec2(400., 0.), 2600.) - a2, gz = n2(w + vec2(0., 400.), 2600.) - a2;
    vec3 N = normalize(vec3(-gx * 3., 1., -gz * 3.));
    float lit = max(dot(N, L), 0.) * 0.7 + 0.3;
    float fw = hg(dot(rd, L), 0.6);
    c = (sunL * lit * (0.18 + fw * 0.6) * smoothstep(0.35, 0.75, hgt + 0.15) + amb * mix(0.35, 1.0, hgt)) * 0.9;
  } else {
    vec3 N = vec3(0., 1., 0.);
    vec3 alb;
    if(uGround == 1 || uGround == 7){
      float a = n2(w, 90.), b = n2(w, 11.), d = n2(w, 2.3);
      alb = mix(vec3(0.022, 0.034, 0.012), vec3(0.055, 0.062, 0.026), a) * (0.7 + 0.6 * b) * (0.8 + 0.4 * d);
    } else if(uGround == 8){
      alb = vec3(0.028, 0.028, 0.03) * (0.8 + 0.4 * n2(w, 25.));
    } else if(uGround == 2){
      float du = sin(w.x / 38. + n2(w, 400.) * 9.) * 0.5 + 0.5;
      float gx = cos(w.x / 38. + n2(w, 400.) * 9.) / 38. * 14.;
      N = normalize(vec3(-gx, 1., (n2(w, 120.) - 0.5) * 0.3));
      alb = vec3(0.32, 0.21, 0.12) * (0.85 + 0.25 * n2(w, 7.)) * (0.8 + 0.2 * du);
    } else if(uGround == 3){
      N = normalize(vec3((n2(w, 30.) - 0.5) * 0.25, 1., (n2(w + 50., 30.) - 0.5) * 0.25));
      alb = vec3(0.86, 0.89, 0.93);
    } else if(uGround == 9){
      return vec3(0.);
    } else {
      alb = vec3(0.03, 0.036, 0.026);
    }
    float ndl = max(dot(N, L), 0.) / max(L.y, 0.02);
    vec3 ambC = amb * (uGround == 3 ? vec3(0.85, 0.93, 1.08) : vec3(1.));
    c = alb * (E * ndl / PI + ambC);
    if(uGround == 3){
      float sp = step(0.9985, hash12(floor(w * 3.)));
      c += sp * sunL * sh * 0.02 * smoothstep(0.02, 0.2, L.y) * (1. - haze);
    }
  }
  return mix(c, hzSky, clamp(haze, 0., 1.));
}

// silhouettes above the horizon: mountains / city skyline. rgb = color, a = coverage
vec4 silhouette(vec3 rd, vec3 sunL, vec3 amb){
  if((uGround != 7 && uGround != 8) || rd.y < -0.004) return vec4(0.);
  float az = azim(rd);
  vec3 hz = skyL(normalize(vec3(rd.x, 0.02, rd.z))) * mix(1., 0.55, uCov);
  float E = max(uLightDir.y, 0.);
  if(uGround == 7){
    for(int i = 0; i < 3; i++){
      float fi = float(i);
      float r = 1.1 + fi * 0.9;
      vec2 cp = vec2(cos(az), sin(az));
      float m = texture(uShape, vec3(cp * r, 0.2 + fi * 0.27)).r * 0.6 + texture(uShape, vec3(cp * r * 3., 0.5 + fi * 0.21)).r * 0.3 + texture(uShape, vec3(cp * r * 9., 0.7)).r * 0.1;
      float h = (0.008 + fi * 0.004) + pow(m, 1.6) * (0.21 - fi * 0.06);
      if(rd.y < h){
        float face = 0.5 + 0.5 * dot(normalize(vec2(rd.x, rd.z)), normalize(vec2(uLightDir.x, uLightDir.z) + 1e-4));
        vec3 rock = vec3(0.045, 0.05, 0.05) * (sunL * E * (0.25 + 0.75 * face) / PI + amb);
        float hz2 = (2. - fi) / 2.;
        float haze = clamp((0.25 + 0.55 * (1. - hz2)) * (0.6 + uTurb * 0.12) + uFog, 0., 0.95);
        return vec4(mix(rock, hz, haze), 1.);
      }
    }
  } else {
    float k = 160. / (2. * PI);
    for(int i = 0; i < 2; i++){
      float fi = float(i);
      float idx = floor(az * k * (1. + fi * 0.6) + fi * 17.);
      float hb = 0.006 + pow(hash12(vec2(idx, fi)), 3.) * (0.07 - fi * 0.03);
      if(rd.y < hb){
        float lx = fract(az * k * (1. + fi * 0.6) + fi * 17.);
        vec3 wall = vec3(0.03, 0.033, 0.04) * (sunL * E * 0.25 / PI + amb * 0.8);
        float night = smoothstep(-0.02, -0.12, uSunDir.y);
        vec2 win = vec2(floor(lx * 6.), floor(rd.y * 900.));
        float lit = step(0.62, hash12(win + idx * 3.1)) * step(0.15, fract(lx * 6.)) * step(fract(rd.y * 900.), 0.6);
        wall += vec3(1., 0.78, 0.45) * lit * night * 0.004;
        float haze = clamp(0.06 + 0.18 * fi + uFog, 0., 0.95);
        return vec4(mix(wall, hz, haze), 1.);
      }
    }
  }
  return vec4(0.);
}

vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0., 1.); }

void main(){
  vec2 fc = gl_FragCoord.xy + (uStyle == 3 ? vec2(0.) : uJit);
  if(uStyle == 3) fc = (floor(fc / uPix) + 0.5) * uPix;
  vec3 rd;
  if(uMode == 0){
    vec2 ndc = fc / uRes * 2. - 1.;
    rd = normalize(uCamF + ndc.x * uTanHalf * (uRes.x / uRes.y) * uCamR + ndc.y * uTanHalf * uCamU);
  } else {
    vec2 uv = fc / uRes;
    float lon = (uv.x - 0.5) * 2. * PI, lat = (uv.y - 0.5) * PI;
    rd = vec3(sin(lon)*cos(lat), sin(lat), -cos(lon)*cos(lat));
  }
  if(uAR == 2 && uMode == 0 && rd.y < 0.012){ rd.y = 0.012; rd = normalize(rd); }
  if(uStyle == 2){
    vec3 wob = vec3(texture(uDetail, rd * 2.2).r, texture(uDetail, rd * 2.2 + 0.37).r, texture(uDetail, rd * 2.2 + 0.71).r) - 0.5;
    rd = normalize(rd + wob * 0.012);
  }
  vec3 sunL = uLightI * transmittance(vec3(0., RP + uBase + 600., 0.), uLightDir);
  vec3 amb = (skyL(vec3(0., 1., 0.)) * 0.6 + skyL(normalize(vec3(uSunDir.x, 0.25, uSunDir.z))) * 0.25 + skyL(normalize(vec3(-uSunDir.x, 0.25, -uSunDir.z))) * 0.15) * 0.95 * mix(1., 0.4, uCov);
  amb += vec3(0.5, 0.62, 0.85) * uMoonOn * uMoonI * 0.12 * smoothstep(0., 0.1, uMoonDir.y) * mix(1., 0.45, uCov);
  float cs = dot(rd, uSunDir);

  vec3 col; float ca = 1.;
  if(rd.y < 0. && uGround != 0){
    col = groundShade(rd, sunL, amb, fc);
    gCloudL = vec3(0.); gCloudA = 1.;
    if(uCamH > uSlabLo - 50.){
      vec4 cl2 = clouds(vec3(0., uCamH, 0.), rd, sunL, amb, fc, uSteps);
      col = col * cl2.a + cl2.rgb; gCloudL = cl2.rgb; gCloudA = cl2.a;
    }
  } else {
    vec4 sc = skyComposite(rd, sunL, amb, fc, uSteps);
    if(uRainbow > 0.) gCloudL += rainbowC(rd) * uRainbow * length(sunL) * 0.0035 * (0.4 + 0.6 * gCloudA);
    col = sc.rgb; ca = sc.a;
  }
  vec4 sil = silhouette(rd, sunL, amb);
  if(sil.a > 0.) col = sil.rgb;

  if(uFog > 0.){
    vec3 fogC = (skyL(normalize(vec3(rd.x, 0.04, rd.z))) * 0.85 + sunL * hg(cs, 0.65) * 0.05) * mix(1., 0.3, uCov) + amb * 0.25;
    float f = uFog * (1. - 0.55 * smoothstep(-0.05, 0.7, rd.y));
    col = mix(col, fogC * 0.8, clamp(f, 0., 1.));
  }

  // stylisation that also belongs in the exported sky
  if(uStyle == 1){
    float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
    col = max(mix(vec3(l), col, 1.35), 0.);
  } else if(uStyle == 2){
    float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
    float ll = log2(max(l, 1e-5)) * 1.8;
    float ql = exp2((floor(ll) + smoothstep(0.3, 0.7, fract(ll))) / 1.8);
    col *= ql / max(l, 1e-5);
    l = ql;
    col = mix(vec3(l), col, 0.8);
    float edge = clamp(length(vec2(dFdx(ca), dFdy(ca))) * 14., 0., 1.);
    col *= 1. - edge * 0.45;
    float paper = texture(uDetail, vec3(fc / 220., 0.5)).r * 0.55 + texture(uShape, vec3(fc / 70., 0.3)).r * 0.45;
    float gran = texture(uDetail, vec3(fc / 18., 0.8)).r;
    col *= 0.78 + paper * 0.3 + (gran - 0.5) * 0.08;
    col = mix(col, col * vec3(1.04, 1.0, 0.92), 0.7);
  }
  if(uMode == 1){ o = vec4(col, 1.); return; }

  vec2 suv = fc / uRes.y;
  float bright = dot(amb, vec3(0.3, 0.5, 0.2)) + 0.02;
  if(uRain > 0.){
    float r = rainLayer(suv, 22., 1.6) + rainLayer(suv + 3.7, 34., 2.1) * 0.7 + rainLayer(suv + 9.1, 55., 2.6) * 0.45;
    col = mix(col, vec3(dot(col, vec3(0.3, 0.55, 0.15))), uRain * 0.25);
    col += r * uRain * bright * 0.55 + uFlash * r * 0.2;
  }
  if(uSnow > 0.){
    float s = snowLayer(suv, 9., 0.22) + snowLayer(suv + 4.2, 16., 0.16) * 0.8 + snowLayer(suv + 7.7, 28., 0.11) * 0.6;
    col += s * uSnow * (bright * 1.4 + 0.02);
  }
  col *= uExposure;
  col = aces(col);
  col = pow(col, vec3(1. / 2.2));
  if(uAR > 0){
    vec2 buv = (gl_FragCoord.xy / uRes) * uBgXf.xy + uBgXf.zw;
    vec3 photo = texture(uBg, buv).rgb;
    float m = texture(uMask, buv).r;
    vec3 outc;
    if(uAR == 1){
      float a = 1. - gCloudA;
      vec3 cr = pow(aces(gCloudL / max(a, 1e-3) * uExposure), vec3(1. / 2.2));
      outc = mix(photo, cr, clamp(a * m * uAROpacity, 0., 1.));
    } else {
      outc = mix(photo, col, clamp(m * uAROpacity, 0., 1.));
    }
    if(uMaskShow > 0.) outc = mix(outc, vec3(0.25, 0.62, 1.), m * 0.3 * uMaskShow);
    col = outc;
  }
  if(uStyle == 3){
    vec2 bc = floor(fc / uPix);
    int bx = int(mod(bc.x, 4.)), by = int(mod(bc.y, 4.));
    float bayer[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
    float th = (bayer[by * 4 + bx] + 0.5) / 16. - 0.5;
    col = floor(col * 14. + th * 0.3 + 0.5) / 14.;
  }
  if(uCVD > 0){
    vec3 sim;
    if(uCVD == 1) sim = col * mat3(0.152286,1.052583,-0.204868, 0.114503,0.786281,0.099216, -0.003882,-0.048116,1.051998);
    else if(uCVD == 2) sim = col * mat3(0.367322,0.860646,-0.227968, 0.280085,0.672501,0.047413, -0.011820,0.042940,0.968881);
    else sim = col * mat3(1.255528,-0.076749,-0.178779, -0.078411,0.930809,0.147602, 0.004733,0.691367,0.303900);
    vec3 err = col - sim;

function rastOne(o){

// photo of a cloud or a drawing on paper -> white silhouette
async function shLoadImage(file){
  const img = new Image(); img.src = URL.createObjectURL(file);
  await new Promise((r, j)=>{ img.onload = r; img.onerror = j; }).catch(()=>{});
  if(!img.naturalWidth){ toast(t("dlErr")); return; }
  const maxW = SH.W*0.9, maxH = SH.H*0.62, sc = Math.min(maxW/img.naturalWidth, maxH/img.naturalHeight);
  const W = Math.max(8, Math.round(img.naturalWidth*sc/3)), H = Math.max(8, Math.round(img.naturalHeight*sc/3));
  const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
  const tc = tmp.getContext("2d", {willReadFrequently:true}); tc.drawImage(img, 0, 0, W, H);
  const d = tc.getImageData(0,0,W,H).data, N = W*H;
  const lum = new Float32Array(N), sat = new Float32Array(N);

  for(let i=0;i<N;i++){ const r=d[i*4]/255, g=d[i*4+1]/255, b=d[i*4+2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    lum[i] = 0.3*r+0.59*g+0.11*b; sat[i] = mx>0.02 ? (mx-mn)/mx : 0; satSum += sat[i]; }
  const mask = new Uint8Array(N);
  const drawing = satSum/N < 0.08 && lum.reduce((a,b)=>a+b,0)/N > 0.6;
  if(drawing){
    // dark lines on light paper: anything enclosed by ink (or the ink itself) is cloud
    const ink = new Uint8Array(N); for(let i=0;i<N;i++) ink[i] = lum[i] < 0.55 ? 1 : 0;
    const out = new Uint8Array(N), st = [];
    for(let x=0;x<W;x++){ st.push(x, (H-1)*W+x); } for(let y=0;y<H;y++){ st.push(y*W, y*W+W-1); }
    while(st.length){ const i = st.pop(); if(out[i] || ink[i]) continue; out[i] = 1; const x = i%W, y = (i/W)|0;
      if(x>0) st.push(i-1); if(x<W-1) st.push(i+1); if(y>0) st.push(i-W); if(y<H-1) st.push(i+W); }
    for(let i=0;i<N;i++) mask[i] = out[i] ? 0 : 1;
  } else {
    // photo: clouds are bright and grey/white, sky is saturated blue. Otsu split on a cloudiness score
    const sc2 = new Float32Array(N); const hist = new Float64Array(64);
    for(let i=0;i<N;i++){ const bl = Math.max(0, d[i*4+2]-d[i*4])/255; sc2[i] = Math.max(0, Math.min(1, 0.55*(1-sat[i]) + 0.45*lum[i] - 0.6*bl)); hist[Math.min(63, (sc2[i]*64)|0)]++; }
    let sum = 0; for(let k=0;k<64;k++) sum += k*hist[k];
    let wB = 0, sB = 0, best = 0, th = 32;
    for(let k=0;k<64;k++){ wB += hist[k]; if(!wB) continue; const wF = N - wB; if(!wF) break; sB += k*hist[k];
      const mB = sB/wB, mF = (sum-sB)/wF, v = wB*wF*(mB-mF)*(mB-mF); if(v > best){ best = v; th = k; } }
    for(let i=0;i<N;i++) mask[i] = sc2[i]*64 > th + 0.5 ? 1 : 0;
    // drop pieces touching the bottom edge (ground, buildings) if anything else is left
    const lab = new Int32Array(N).fill(-1), touch = []; let nl = 0;
    for(let s0=0;s0<N;s0++){ if(!mask[s0] || lab[s0]>=0) continue; let tb = false; const st = [s0]; lab[s0] = nl;
      while(st.length){ const i = st.pop(), x = i%W, y = (i/W)|0; if(y === H-1) tb = true;
        for(const j of [x>0?i-1:-1, x<W-1?i+1:-1, y>0?i-W:-1, y<H-1?i+W:-1]) if(j>=0 && mask[j] && lab[j]<0){ lab[j] = nl; st.push(j); } }
      touch.push(tb); nl++; }
    if(touch.some(x=>!x)) for(let i=0;i<N;i++) if(mask[i] && touch[lab[i]]) mask[i] = 0;
  }
  const out = tc.createImageData(W, H);
  for(let i=0;i<N;i++){ const v = mask[i] ? 255 : 0; out.data[i*4] = mask[i]?255:13; out.data[i*4+1] = mask[i]?255:20; out.data[i*4+2] = mask[i]?255:32; out.data[i*4+3] = 255; }
  tc.putImageData(out, 0, 0);

  const dw = W*3, dh = H*3, gy = SH.H*0.72;
  SH.cx.imageSmoothingEnabled = true; SH.cx.drawImage(tmp, (SH.W-dw)/2, Math.max(8, gy - dh - 10), dw, dh);

}
function shExtract(){
  const sc = 4, W = Math.ceil(SH.W/sc), H = Math.ceil(SH.H/sc);
  const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
  const tc = tmp.getContext("2d", {willReadFrequently:true}); tc.drawImage(SH.cv, 0, 0, W, H);
  const d = tc.getImageData(0,0,W,H).data;
  let x0 = W, x1 = -1, y0 = H, y1 = -1;
  const on = (x, y)=>d[(y*W+x)*4] > 128;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(on(x,y)){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1 < x0 + 2 || y1 < y0 + 1) return null;
  const n = 64, bw = x1-x0+1, bh = y1-y0+1, prof = [];
  for(let k=0;k<n;k++){
    const xa = x0 + Math.floor(k*bw/n), xb = Math.max(xa+1, x0 + Math.floor((k+1)*bw/n));
    let top = -1, bot = -1;
    for(let x=xa;x<xb;x++) for(let y=y0;y<=y1;y++) if(on(x,y)){ const tt = (y1-y+1)/bh, bb = (y1-y)/bh; if(tt>top) top = tt; if(bot<0 || bb<bot) bot = bb; }
    prof.push(top < 0 ? [0,0] : [Math.round(bot*1000)/1000, Math.round(top*1000)/1000]);
  }

async function shImport(file){
  try{
    let buf = new Uint8Array(await file.arrayBuffer()), txt;
    if(buf[0] === 0x50 && buf[1] === 0x4b){

      if(dv.getUint16(8, true) !== 0) throw 0;

      const prof = sh.prof.slice(0, 256).map(q=>[Math.max(0, Math.min(1, +q[0] || 0)), Math.max(0, Math.min(1, +q[1] || 0))]);

function wbConvert(){
  // quarter-resolution mask; closed outlines are filled, scribbles count as filled too
  const sc = 4, W = Math.ceil(innerWidth/sc), H = Math.ceil(innerHeight/sc);
  const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
  const tc = tmp.getContext("2d", {willReadFrequently:true});
  tc.fillStyle = "#fff"; tc.fillRect(0,0,W,H); tc.drawImage(WB.cv, 0, 0, W, H);
  const d = tc.getImageData(0,0,W,H).data, N = W*H;
  const ink = new Uint8Array(N); for(let i=0;i<N;i++) ink[i] = d[i*4] < 170 ? 1 : 0;
  // dilate once so hand-drawn outlines close up
  const ink2 = new Uint8Array(N);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let v = 0; for(let dy=-1;dy<=1&&!v;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx>=0&&yy>=0&&xx<W&&yy<H&&ink[yy*W+xx]){ v=1; break; } } ink2[y*W+x] = v; }
  const outside = new Uint8Array(N), q = [];
  for(let x=0;x<W;x++){ for(const y of [0, H-1]){ const i=y*W+x; if(!ink2[i] && !outside[i]){ outside[i]=1; q.push(i); } } }
  for(let y=0;y<H;y++){ for(const x of [0, W-1]){ const i=y*W+x; if(!ink2[i] && !outside[i]){ outside[i]=1; q.push(i); } } }
  while(q.length){ const i = q.pop(), x = i%W, y = (i/W)|0;
    for(const j of [x>0?i-1:-1, x<W-1?i+1:-1, y>0?i-W:-1, y<H-1?i+W:-1]) if(j>=0 && !ink2[j] && !outside[j]){ outside[j]=1; q.push(j); } }
  const mask = new Uint8Array(N); for(let i=0;i<N;i++) mask[i] = outside[i] ? 0 : 1;
  // one cloud per connected shape
  const lab = new Int32Array(N).fill(-1); const comps = [];
  for(let i=0;i<N;i++){ if(!mask[i] || lab[i]>=0) continue;
    const pts = [], st = [i]; lab[i] = comps.length;
    while(st.length){ const k = st.pop(), x = k%W, y = (k/W)|0; pts.push([x*sc+sc/2, y*sc+sc/2]);
      for(const j of [x>0?k-1:-1, x<W-1?k+1:-1, y>0?k-W:-1, y<H-1?k+W:-1]) if(j>=0 && mask[j] && lab[j]<0){ lab[j]=comps.length; st.push(j); } }
    comps.push(pts); }
  let made = 0; pushUndo();
  for(const pts of comps){ if(pts.length < 12) continue; if(buildCloudFromPoints(pts, {type:WB.type, den:S.bDen, dist:WB.dist})) made++; }
  if(!made){ popUndo(); toast(t("lbl_low")); return; }
  mapDirty = true; needRender = true;
  WB.el.style.display = "none";
  toast(t("wb_done").replace("{n}", made));
}

// ---------------- Rebuild a sky from a photo ----------------
async function reconstructFromPhoto(file){
  const img = new Image(), url = URL.createObjectURL(file);
  await new Promise((res, rej)=>{ img.onload = res; img.onerror = rej; img.src = url; });
  const sw = img.naturalWidth, sh = img.naturalHeight, aspect = sw/sh;
  // sky region (same detector as the overlay)
  AR.sw = sw; AR.sh = sh; AR.edit = null; AR.MW = 0; AR.computeMask(img);
  const MW = AR.MW, MH = AR.MH, sky = AR.auto;
  const cv = document.createElement("canvas"); cv.width = MW; cv.height = MH;
  const cx = cv.getContext("2d", {willReadFrequently:true}); cx.drawImage(img, 0, 0, MW, MH);
  const px = cx.getImageData(0,0,MW,MH).data, N = MW*MH;
  let skyN = 0; for(let i=0;i<N;i++) if(sky[i] > 0.5) skyN++;
  if(skyN < N*0.04){ toast(t("rec_fail")); return; }
  // camera: assume a ~65° wide phone/camera lens; tilt so the photo's horizon matches
  const hfov = 65*Math.PI/180, vfov = 2*Math.atan(Math.tan(hfov/2)/aspect);
  S.fov = Math.min(100, Math.max(25, vfov*180/Math.PI));
  const lows = [];
  for(let x=0;x<MW;x++){ let lo = -1; for(let y=0;y<MH;y++) if(sky[y*MW+x] > 0.5) lo = y; if(lo >= 0) lows.push(lo); }
  lows.sort((a,b)=>a-b);
  const yh = lows.length ? (lows[Math.floor(lows.length*0.5)] + 1)/MH : 1;
  S.pitch = Math.atan((yh - 0.5)*2*Math.tan(vfov/2)) + 0.01;
  // per-pixel classes inside the sky
  const cloud = new Uint8Array(N);
  let cr=0,cg=0,cb=0,cn=0, kr=0,kg=0,kb=0,kn=0, ar=0,ag=0,ab=0, sunX=0, sunY=0, sunN=0;
  for(let i=0;i<N;i++){
    if(sky[i] <= 0.5) continue;
    const r = px[i*4]/255, g = px[i*4+1]/255, b = px[i*4+2]/255, v = Math.max(r,g,b), mn = Math.min(r,g,b), sat = v>0 ? (v-mn)/v : 0;
    const blue = b - (r+g)/2;
    ar += r; ag += g; ab += b;
    if(v > 0.985 && sat < 0.12){ sunX += i%MW; sunY += (i/MW)|0; sunN++; }
    const clear = blue > 0.05 && sat > 0.16;
    if(!clear && v > 0.2){ cloud[i] = 1; kr += r; kg += g; kb += b; kn++; } else { cr += r; cg += g; cb += b; cn++; }
  }
  ar /= skyN; ag /= skyN; ab /= skyN;
  const L = 0.3*ar + 0.59*ag + 0.11*ab, warm = ar - ab, coverage = kn / skyN;
  // time of day and haze
  const keep = {ground:S.ground, style:S.style};
  pushUndo();
  map.fill(0); map2.fill(0); resetTint(tintB); objects = []; selObj = -1; rasterObjects();
  Object.assign(S, {dust:0, fog:0, rain:0, snow:0, storm:false, rainbow:0, rays:0, halo:0, irid:0, milky:0, aurora:0, moon:false, covScale:1, cirScale:1, preset:null}, keep);
  const camAz = ((S.yaw*180/Math.PI) % 360 + 360) % 360;
  if(L < 0.1){ S.sunEl = -16; S.milky = 0.6; S.turb = 1.3; }
  else if(warm > 0.07){ S.sunEl = 2.5; S.turb = 2.6; S.sunAz = camAz; }
  else {
    S.sunEl = 18 + 42*Math.min(1, Math.max(0, (L - 0.3)/0.5));
    const csat = cn ? (Math.max(cr,cg,cb) - Math.min(cr,cg,cb)) / Math.max(cr,cg,cb,1e-3) : 0.1;
    S.turb = Math.min(8, 1.3 + (1 - Math.min(1, csat*2.2))*5);
    S.sunAz = (camAz + 160) % 360;
  }
  const toScreen = (x, y)=>[innerWidth/2 + ((x+0.5)/MW - 0.5)*innerHeight*aspect, (y+0.5)/MH*innerHeight];
  if(sunN > 0 && sunN < skyN*0.04 && L >= 0.1){
    const p = toScreen(sunX/sunN, sunY/sunN), d = screenRay(p[0], p[1]);
    S.sunAz = ((Math.atan2(d[0], -d[2])*180/Math.PI) + 360) % 360; S.sunEl = Math.max(1, Math.asin(d[1])*180/Math.PI);
  }
  // clouds
  const dark = kn ? (0.3*kr + 0.59*kg + 0.11*kb)/kn : 1;
  if(coverage > 0.72){
    const type = dark < 0.32 ? "nimbostratus" : "stratocumulus";
    S.base = dark < 0.32 ? 750 : 1300;
    fillLayer(type, Math.min(1, coverage*0.98), 0.55, 31);
    if(dark < 0.3) S.rain = 0.6;
  } else if(kn){
    const lab = new Int32Array(N).fill(-1); let made = 0;
    for(let i=0;i<N;i++){
      if(!cloud[i] || lab[i]>=0) continue;
      const comp = [], st = [i]; lab[i] = 1;
      let x0=1e9,x1=-1,y0=1e9,y1=-1;
      while(st.length){ const k = st.pop(), x = k%MW, y = (k/MW)|0; comp.push(k); x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y);
        for(const j of [x>0?k-1:-1, x<MW-1?k+1:-1, y>0?k-MW:-1, y<MH-1?k+MW:-1]) if(j>=0 && cloud[j] && lab[j]<0){ lab[j]=1; st.push(j); } }
      if(comp.length < 6) continue;
      const bw = x1-x0+1, bh = y1-y0+1, fill = comp.length/(bw*bh);
      let type = "cumulus", flat;
      if(fill < 0.33 && bw > bh*2) type = "cirrus";
      else if(bw > bh*3.2){ type = "stratocumulus"; flat = 0.8; }
      const pts = [];
      for(const k of comp){ const x = k%MW, y = (k/MW)|0; pts.push(toScreen(x, y), toScreen(x+0.5, y), toScreen(x, y+0.5), toScreen(x+0.5, y+0.5)); }
      if(buildCloudFromPoints(pts, {type, den:0.85, dist:2, flat})) made++;
    }
  }
  needLUT = true; mapDirty = true; needRender = true; updateViewBar();
  toast(t("rec_done"));
}

const meteors = [null, null];
function updateMeteors(dt){
  for(let i=0;i<2;i++){
    const m = meteors[i];
    if(m){ m.p += dt / m.dur; if(m.p >= 1) meteors[i] = null; continue; }
    if(Math.random() < dt * S.meteors * 0.6){
      const az = Math.random()*Math.PI*2, el = 0.35 + Math.random()*0.8;
      const a = [Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el)];
      const az2 = az + (Math.random()-0.5)*0.6, el2 = el - 0.15 - Math.random()*0.25;
      const b = [Math.sin(az2)*Math.cos(el2), Math.sin(el2), -Math.cos(az2)*Math.cos(el2)];
      meteors[i] = {a, b, p: 0.001, dur: 0.5 + Math.random()*0.7};
    }
  }
}
